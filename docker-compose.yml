# Description: Defines and runs the multi-service application stack (Backend, Frontend, Prometheus, Grafana).
# Author:      Hongyu Tu
# Created:     Nov 20, 2025
#-------------------------------------------------------------------------------

#-------------------------------------------------------------------------------
# File:        docker-compose.yml
# Description: Defines and runs the multi-service application stack.
#              FIX: Forces linux/amd64 platform for backend to support slideio.
#-------------------------------------------------------------------------------

services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    platform: linux/amd64  # <--- CRITICAL: Forces x86 emulation for slideio/instanseg
    container_name: tissuelab-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./model_cache:/root/.cache
    environment:
      - MAX_WORKERS=4
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: tissuelab-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: tissuelab-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    container_name: tissuelab-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

